[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.3.0",
    "pyjwt[crypto]",
    "starlette",
    "uvicorn",
]

[project.scripts]
brain = "brain.__main__:main"

[tool.setuptools]
packages = ["brain"]
